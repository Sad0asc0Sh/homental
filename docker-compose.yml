services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: homental-postgres
    environment:
      POSTGRES_USER: homental
      POSTGRES_PASSWORD: homental_dev
      POSTGRES_DB: homental
    ports:
      - '5432:5432'
    volumes:
      - homental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homental -d homental']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: homental-redis
    ports:
      - '6379:6379'
    volumes:
      - homental_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ['fullstack']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: homental-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://homental:homental_dev@postgres:5432/homental
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-homental-docker-access-secret-change-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-homental-docker-refresh-secret-change-me-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-120}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5

  customer:
    profiles: ['fullstack']
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
        NEXT_PUBLIC_PARTNERS_URL: ${NEXT_PUBLIC_PARTNERS_URL:-http://localhost:3002}
    container_name: homental-customer
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3001:3001'

  partners:
    profiles: ['fullstack']
    build:
      context: .
      dockerfile: apps/partners/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
        NEXT_PUBLIC_CUSTOMER_URL: ${NEXT_PUBLIC_CUSTOMER_URL:-http://localhost:3001}
    container_name: homental-partners
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3002:3002'

volumes:
  homental_pgdata:
  homental_redisdata:
