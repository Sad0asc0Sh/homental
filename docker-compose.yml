services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: homental-postgres
    environment:
      POSTGRES_USER: homental
      POSTGRES_PASSWORD: homental_dev
      POSTGRES_DB: homental
    ports:
      - '5432:5432'
    volumes:
      - homental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homental -d homental']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: homental-redis
    ports:
      - '6379:6379'
    volumes:
      - homental_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  homental_pgdata:
  homental_redisdata:
